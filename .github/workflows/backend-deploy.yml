name: Backend CI/CD

# Compila el backend contra los .csproj individuales, no contra Plataforma.slnx
# — el runner hospedado de GitHub no garantiza traer un SDK de .NET lo bastante
# reciente como para entender el formato .slnx, a diferencia de esta máquina.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  WEBAPI_PROJECT: src/WebApi/Plataforma.WebApi.csproj
  DOMAIN_TESTS_PROJECT: tests/Domain.Tests/Plataforma.Domain.Tests.csproj
  APPLICATION_TESTS_PROJECT: tests/Application.Tests/Plataforma.Application.Tests.csproj
  PUBLISH_OUTPUT_PATH: ${{ github.workspace }}/publish

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: |
          dotnet restore ${{ env.WEBAPI_PROJECT }}
          dotnet restore ${{ env.DOMAIN_TESTS_PROJECT }}
          dotnet restore ${{ env.APPLICATION_TESTS_PROJECT }}

      - name: dotnet build
        run: dotnet build ${{ env.WEBAPI_PROJECT }} --configuration Release --no-restore

      - name: dotnet test — Domain
        run: dotnet test ${{ env.DOMAIN_TESTS_PROJECT }} --configuration Release --no-restore --logger trx --results-directory TestResults

      - name: dotnet test — Application
        run: dotnet test ${{ env.APPLICATION_TESTS_PROJECT }} --configuration Release --no-restore --logger trx --results-directory TestResults

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults

      - name: dotnet publish WebApi
        run: dotnet publish ${{ env.WEBAPI_PROJECT }} --configuration Release --no-restore --output ${{ env.PUBLISH_OUTPUT_PATH }}

      - name: Subir artefacto de publicación
        uses: actions/upload-artifact@v4
        with:
          name: webapi-package
          path: ${{ env.PUBLISH_OUTPUT_PATH }}

  deploy:
    name: Desplegar en Azure App Service
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    # Login federado OIDC — sin secretos de larga duración. Requiere configurar
    # una "federated credential" en el App Registration de Azure apuntando a
    # este repo/branch (az ad app federated-credential create).
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Descargar artefacto de publicación
        uses: actions/download-artifact@v4
        with:
          name: webapi-package
          path: ${{ env.PUBLISH_OUTPUT_PATH }}

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_OUTPUT_PATH }}
