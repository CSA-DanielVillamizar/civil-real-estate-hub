name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: npm run test
        working-directory: frontend
        run: npm run test

      # Se compila explícitamente aquí (en vez de dejar que la acción de SWA
      # lo haga con Oryx) para poder inyectar la URL real del backend en el
      # build de producción — el proxy de /api que usa Vite en desarrollo
      # (vite.config.ts) no existe una vez publicado como sitio estático.
      - name: npm run build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_API_BASE_URL }}

      # Con skip_app_build: true la acción sube el contenido de app_location
      # tal cual, IGNORANDO output_location (ese combo solo aplica cuando ella
      # misma hace el build con Oryx) — por eso app_location debe apuntar
      # directo a la carpeta ya compilada.
      - name: Desplegar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/dist'
          skip_app_build: true
