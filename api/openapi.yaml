openapi: 3.0.3
info:
  title: Plataforma Web Integral de Ingeniería Civil e Inmobiliaria — API
  description: >
    Contratos de la Fase 2 (SDD) para los endpoints críticos de los bounded
    contexts Inmobiliaria y CRM/Leads. Corresponde al modelo de dominio
    aprobado en docs/01-domain-model.md (v1.1).
  version: 0.2.0
servers:
  - url: https://api.plataforma-civil-inmobiliaria.local/v1
    description: Entorno de referencia (a reemplazar por Azure App Service en Fase 4+)

tags:
  - name: Auth
    description: >
      Autenticación por JWT (reemplaza el API key administrativo compartido
      de la Fase 3). Roles: Admin (acceso completo) y AsesorComercial
      (acotado a /api/leads/admin y sus transiciones de estado).
  - name: Leads
    description: Captación de leads (CRM)
  - name: Properties
    description: Consulta de inmuebles (Inmobiliaria)
  - name: Budgets
    description: Calculadora de obra (Domain Service sin persistencia)
  - name: ViabilidadAmbiental
    description: >
      Fase 3 (SDD): solicitud de estudio de viabilidad ambiental pagado por
      transferencia manual (sin pasarela de pago) y confirmación
      administrativa del pago.
  - name: Obras
    description: >
      P3: portal de avance de obra. El cliente entra a /api/obras/por-token/
      {token} sin usuario ni contraseña — el token generado al crear el
      proyecto es la única credencial de acceso.

paths:
  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Autentica un usuario y devuelve un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Email o password incorrectos, o usuario inactivo

  /api/leads:
    post:
      tags: [Leads]
      operationId: createLead
      summary: Registra un nuevo lead, opcionalmente originado en la calculadora de obra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadRequest'
      responses:
        '201':
          description: Lead creado
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLeadResponse'
        '400':
          description: Error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'

  /api/leads/presupuesto-pdf:
    post:
      tags: [Leads]
      operationId: generarPresupuestoPdf
      summary: >
        Registra un lead (calificado automáticamente — descargar el PDF es una
        señal de intención más fuerte que solo usar la calculadora) y
        devuelve el presupuesto en PDF. Reutiliza el mismo request body que
        POST /api/leads; datosCalculoObra es obligatorio para este endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadRequest'
      responses:
        '200':
          description: PDF del presupuesto generado
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'

  /api/leads/admin:
    get:
      tags: [Leads]
      operationId: getLeadsAdmin
      summary: >
        Panel administrativo (CRM mínimo): lista leads con sus datos de
        contacto — por eso requiere el mismo API key que el resto de
        endpoints administrativos, no es público.
      security:
        - BearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoLead'
      responses:
        '200':
          description: Listado de leads (más reciente primero)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadListItem'
        '401':
          description: Token JWT ausente, inválido o expirado

  /api/leads/{id}/marcar-contactado:
    post:
      tags: [Leads]
      operationId: marcarLeadContactado
      summary: Transición Nuevo → Contactado. Administrativo.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lead actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadEstadoResponse'
        '400':
          description: El lead no está en un estado que permita esta transición
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un lead con ese id

  /api/leads/{id}/calificar:
    post:
      tags: [Leads]
      operationId: calificarLead
      summary: Transición Contactado → Calificado. Administrativo.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lead actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadEstadoResponse'
        '400':
          description: El lead no está en un estado que permita esta transición
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un lead con ese id

  /api/leads/{id}/convertir:
    post:
      tags: [Leads]
      operationId: convertirLead
      summary: Transición Calificado → Convertido. Administrativo.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lead actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadEstadoResponse'
        '400':
          description: El lead no está en un estado que permita esta transición
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un lead con ese id

  /api/leads/{id}/descartar:
    post:
      tags: [Leads]
      operationId: descartarLead
      summary: Marca el lead como Descartado, con motivo. No aplica si ya está Convertido. Administrativo.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Lead actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadEstadoResponse'
        '400':
          description: Error de validación o el lead ya está Convertido
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un lead con ese id

  /api/properties:
    get:
      tags: [Properties]
      operationId: getProperties
      summary: >
        Lista propiedades con filtros y paginación. Público — siempre
        filtra Estado=Publicada sin importar otros parámetros (ver
        GetPropertiesQueryHandler); usar GET /api/properties/admin para
        ver borradores.
      parameters:
        - name: tipoInmueble
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoInmueble'
        - name: municipio
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: precioMin
          in: query
          required: false
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: precioMax
          in: query
          required: false
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: areaMin
          in: query
          required: false
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: areaMax
          in: query
          required: false
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: soloViablesConstructivamente
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de propiedades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPropertyResponse'
        '400':
          description: Error de validación de filtros
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'

    post:
      tags: [Properties]
      operationId: createProperty
      summary: Crea una propiedad en estado Borrador. Administrativo.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPropiedadRequest'
      responses:
        '201':
          description: Propiedad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrearPropiedadResponse'
        '400':
          description: Error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Token JWT ausente, inválido o expirado

  /api/properties/admin:
    get:
      tags: [Properties]
      operationId: getPropertiesAdmin
      summary: >
        Lista propiedades en cualquier estado (incluyendo Borrador).
        Administrativo — a diferencia de GET /api/properties, aquí el
        estado es un filtro real que controla el llamador.
      security:
        - BearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoPropiedad'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de propiedades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPropertyResponse'
        '401':
          description: Token JWT ausente, inválido o expirado

  /api/properties/{id}:
    get:
      tags: [Properties]
      operationId: getPropertyById
      summary: >
        Detalle completo de una propiedad (multimedia, retiros
        ambientales, restricciones de viabilidad). Público, sin filtrar
        por estado — el id es un GUID no enumerable, ver análisis de
        Fase 4.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la propiedad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetailResponse'
        '404':
          description: No existe una propiedad con ese id

  /api/properties/{id}/multimedia:
    post:
      tags: [Properties]
      operationId: agregarMultimediaAPropiedad
      summary: >
        Sube una foto/plano/render/video a Azure Blob Storage y lo agrega
        a la propiedad. Administrativo, multipart/form-data.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, tipo]
              properties:
                archivo:
                  type: string
                  format: binary
                tipo:
                  $ref: '#/components/schemas/TipoMultimedia'
      responses:
        '200':
          description: Archivo subido y agregado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgregarMultimediaResponse'
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe una propiedad con ese id

  /api/properties/{id}/publicar:
    post:
      tags: [Properties]
      operationId: publicarPropiedad
      summary: >
        Publica la propiedad (Borrador → Publicada). Falla si no tiene
        precio o al menos un archivo multimedia. Administrativo.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Propiedad publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicarPropiedadResponse'
        '400':
          description: La propiedad no cumple las condiciones para publicarse
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe una propiedad con ese id

  /api/budgets/calculate:
    post:
      tags: [Budgets]
      operationId: calculateBudget
      summary: Calcula una estimación de costo de obra (sin persistencia)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosCalculoObra'
      responses:
        '200':
          description: Estimación calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimacionCosto'
        '400':
          description: Error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'

  /api/viabilidad-ambiental/solicitudes:
    post:
      tags: [ViabilidadAmbiental]
      operationId: solicitarViabilidadAmbiental
      summary: >
        Registra una solicitud de estudio de viabilidad ambiental. El pago se
        hace por transferencia manual (sin pasarela): la respuesta incluye el
        monto y los datos bancarios, y también se envían por correo. Debe
        indicarse propiedadId (lote ya catalogado) o departamento/municipio
        (lote aún no catalogado) — exactamente uno de los dos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarViabilidadAmbientalRequest'
      responses:
        '201':
          description: Solicitud registrada
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitarViabilidadAmbientalResponse'
        '400':
          description: Error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'

    get:
      tags: [ViabilidadAmbiental]
      operationId: getSolicitudesViabilidadAmbiental
      summary: >
        Lista las solicitudes de viabilidad ambiental, con los datos de
        contacto del solicitante — por eso requiere el mismo API key
        administrativo que confirmar-pago, no es un endpoint público.
      security:
        - BearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoSolicitudViabilidad'
      responses:
        '200':
          description: Listado de solicitudes (más reciente primero)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudViabilidadAmbientalListItem'
        '401':
          description: Token JWT ausente, inválido o expirado

  /api/viabilidad-ambiental/solicitudes/{id}/confirmar-pago:
    post:
      tags: [ViabilidadAmbiental]
      operationId: confirmarPagoViabilidadAmbiental
      summary: >
        Acción administrativa: marca la solicitud como pagada, tras verificar
        manualmente la transferencia. Requiere el header X-Admin-Api-Key.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pago confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmarPagoViabilidadAmbientalResponse'
        '400':
          description: >
            La solicitud no está en un estado que permita confirmar el pago
            (ej. ya estaba Pagada o Rechazada)
          content:
            application/problem+json:
              schema:
                type: object
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe una solicitud con ese id

  /api/obras:
    post:
      tags: [Obras]
      operationId: crearProyectoObra
      summary: Crea un proyecto de obra y genera su token de acceso para el cliente.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearProyectoObraRequest'
      responses:
        '201':
          description: Proyecto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrearProyectoObraResponse'
        '401':
          description: Token JWT ausente, inválido o expirado

  /api/obras/admin:
    get:
      tags: [Obras]
      operationId: getProyectosObraAdmin
      summary: Lista todos los proyectos de obra.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado de proyectos (más reciente primero)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProyectoObraListItem'
        '401':
          description: Token JWT ausente, inválido o expirado

  /api/obras/admin/{id}:
    get:
      tags: [Obras]
      operationId: getProyectoObraAdmin
      summary: Detalle de un proyecto de obra (para gestionar sus hitos).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del proyecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyectoObraDetalle'
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un proyecto con ese id

  /api/obras/{id}/hitos:
    post:
      tags: [Obras]
      operationId: agregarHito
      summary: Agrega un hito al final de la lista de hitos del proyecto.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgregarHitoRequest'
      responses:
        '200':
          description: Hito agregado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HitoResponse'
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un proyecto con ese id

  /api/obras/{id}/hitos/{hitoId}/estado:
    post:
      tags: [Obras]
      operationId: cambiarEstadoHito
      summary: Cambia el estado de un hito (Pendiente, EnProgreso, Completado).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hitoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoHitoRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoHitoResponse'
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un proyecto con ese id, o no existe ese hito en el proyecto

  /api/obras/{id}/hitos/{hitoId}/evidencia:
    post:
      tags: [Obras]
      operationId: agregarEvidenciaHito
      summary: Sube una foto de evidencia para un hito (multipart/form-data).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hitoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Evidencia agregada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgregarEvidenciaHitoResponse'
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un proyecto con ese id, o no existe ese hito en el proyecto

  /api/obras/{id}/estado:
    post:
      tags: [Obras]
      operationId: cambiarEstadoProyecto
      summary: Cambia el estado general del proyecto (Planificacion, EnEjecucion, Pausado, Finalizado).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoProyectoRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoProyectoResponse'
        '401':
          description: Token JWT ausente, inválido o expirado
        '404':
          description: No existe un proyecto con ese id

  /api/obras/por-token/{token}:
    get:
      tags: [Obras]
      operationId: getProyectoObraPorToken
      summary: >
        Detalle del proyecto para el cliente — público, sin autenticación:
        el token en sí ES la credencial de acceso.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalle del proyecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProyectoObraDetalle'
        '404':
          description: No existe ningún proyecto con ese token

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RolUsuario:
      type: string
      enum: [Admin, AsesorComercial]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expiraEn:
          type: string
          format: date-time
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/RolUsuario'

    OrigenLead:
      type: string
      enum: [CalculadoraObra, FormularioContacto, LandingPage, Referido]

    ServicioDeInteres:
      type: string
      enum: [Inmobiliaria, CalculadoraDeObra, ConsultoriaYDisenoEstructural, InterventoriaYPresupuestos]
      description: >
        Independiente de origen (el canal): indica qué servicio le interesa
        al lead. Se infiere automáticamente cuando origen=CalculadoraObra o
        hay propiedadDeInteresId; en los demás casos lo indica el llamador.

    EstadoLead:
      type: string
      enum: [Nuevo, Contactado, Calificado, Convertido, Descartado, ContactoPendientePorReasignacion]

    TipoAcabado:
      type: string
      enum: [Basico, Medio, Alto]

